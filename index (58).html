<!DOCTYPE html>
<html lang="am" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ተክለ ቴዎፍሎስ ሰ/ት/ቤት ትምህርት እና ሥልጠና ክፍል | Tekle Tewophilos Sunday School Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #162a4a;
    --primary-dark: #0e1c33;
    --accent: #b88a28;
    --accent-light: #e7c675;
    --bg: #f6f4ef;
    --surface: #ffffff;
    --surface-alt: #faf8f3;
    --text: #18202c;
    --muted: #5c6675;
    --border: #e4decb;
    --success: #157347;
    --danger: #b42318;
    --warning: #b54708;
    --shadow: 0 10px 30px rgba(22, 42, 74, 0.08);
    --radius: 14px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Noto Sans Ethiopic', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* Header & Navigation */
  header {
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
    color: #fff;
    border-bottom: 3px solid var(--accent);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }

  .header-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.85rem;
  }

  .logo-box {
    width: 52px;
    height: 52px;
    border-radius: 12px;
    background: rgba(255,255,255,0.08);
    border: 1.5px solid var(--accent-light);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }

  .logo-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .brand-titles h1 {
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: 0.2px;
    color: #fff;
  }

  .brand-titles p {
    font-size: 0.78rem;
    color: var(--accent-light);
    font-weight: 500;
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
  }

  .pill-btn {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.22);
    padding: 0.45rem 0.85rem;
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }

  .pill-btn:hover {
    background: rgba(255,255,255,0.2);
    transform: translateY(-1px);
  }

  .pill-btn.gold {
    background: var(--accent);
    border-color: var(--accent-light);
    color: #fff;
  }

  .pill-btn.gold:hover {
    background: #9f751d;
  }

  .pill-btn.danger {
    background: rgba(180, 35, 24, 0.25);
    border-color: rgba(255,255,255,0.25);
  }

  /* Nav Tabs Bar */
  .nav-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 1.25rem;
    overflow-x: auto;
  }

  .nav-tabs {
    max-width: 1280px;
    margin: 0 auto;
    display: flex;
    gap: 0.35rem;
  }

  .tab-btn {
    background: transparent;
    border: none;
    border-bottom: 3px solid transparent;
    padding: 0.85rem 1rem;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: all 0.2s ease;
  }

  .tab-btn:hover {
    color: var(--primary);
  }

  .tab-btn.active {
    color: var(--primary);
    border-bottom-color: var(--accent);
  }

  /* Main Container */
  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 3.5rem;
  }

  /* Session Status Banner */
  .session-strip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: var(--radius);
    padding: 0.75rem 1.1rem;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    font-size: 0.88rem;
    box-shadow: var(--shadow);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.22rem 0.65rem;
    border-radius: 999px;
    font-size: 0.76rem;
    font-weight: 700;
  }

  .badge-navy { background: rgba(22, 42, 74, 0.1); color: var(--primary); }
  .badge-gold { background: rgba(184, 138, 40, 0.16); color: #8c6614; }
  .badge-green { background: rgba(21, 115, 71, 0.12); color: var(--success); }
  .badge-red { background: rgba(180, 35, 24, 0.12); color: var(--danger); }

  /* Hero */
  .hero {
    background: linear-gradient(125deg, var(--primary) 0%, var(--primary-dark) 75%);
    color: #fff;
    border-radius: 18px;
    padding: 2rem;
    margin-bottom: 1.75rem;
    border: 1px solid rgba(231, 198, 117, 0.35);
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }

  .hero::after {
    content: "";
    position: absolute;
    right: -60px;
    top: -60px;
    width: 240px;
    height: 240px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(231,198,117,0.18), transparent 70%);
    pointer-events: none;
  }

  .hero h2 {
    font-size: 1.55rem;
    font-weight: 800;
    margin-bottom: 0.45rem;
  }

  .hero p {
    color: rgba(255,255,255,0.88);
    max-width: 760px;
    font-size: 0.95rem;
  }

  .custom-btn-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.65rem;
    margin-top: 1.15rem;
  }

  /* Grid & Cards */
  .grid-2 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 1.25rem;
  }

  .grid-3 {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
    gap: 1.25rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    box-shadow: var(--shadow);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  .card:hover {
    transform: translateY(-2px);
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    margin-bottom: 1.15rem;
  }

  .section-title {
    font-size: 1.2rem;
    font-weight: 800;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  /* Toolbar / Search / Filter */
  .toolbar {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    margin-bottom: 1.25rem;
    background: var(--surface);
    padding: 0.9rem;
    border-radius: var(--radius);
    border: 1px solid var(--border);
  }

  input, select, textarea {
    width: 100%;
    padding: 0.62rem 0.8rem;
    border: 1px solid #cfd6df;
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.9rem;
    background: #fff;
    color: var(--text);
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(184, 138, 40, 0.16);
  }

  label {
    display: block;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 0.3rem;
  }

  .field {
    margin-bottom: 0.85rem;
  }

  .btn {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 0.58rem 1rem;
    border-radius: 10px;
    font-size: 0.86rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    text-decoration: none;
    transition: all 0.18s ease;
  }

  .btn:hover {
    opacity: 0.92;
    transform: translateY(-1px);
  }

  .btn-gold {
    background: var(--accent);
    color: #fff;
  }

  .btn-outline {
    background: transparent;
    color: var(--primary);
    border: 1.5px solid var(--primary);
  }

  .btn-danger {
    background: var(--danger);
    color: #fff;
  }

  .btn-sm {
    padding: 0.38rem 0.72rem;
    font-size: 0.78rem;
    border-radius: 8px;
  }

  /* Book Card */
  .book-cover {
    height: 112px;
    border-radius: 10px;
    padding: 0.9rem;
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    margin-bottom: 0.85rem;
  }

  .book-title {
    font-size: 1rem;
    font-weight: 800;
    color: var(--primary);
    margin-bottom: 0.2rem;
  }

  .book-sub {
    font-size: 0.84rem;
    color: var(--muted);
    margin-bottom: 0.65rem;
  }

  /* Notice Item */
  .notice-card {
    border-left: 4px solid var(--primary);
    margin-bottom: 0.95rem;
  }

  .notice-card.urgent {
    border-left-color: var(--danger);
    background: #fffafa;
  }

  .notice-card.gold {
    border-left-color: var(--accent);
  }

  /* Classroom Box */
  .classroom-card {
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 1.15rem;
    background: var(--surface-alt);
  }

  .classroom-card.live {
    border-color: var(--success);
    background: #f4fbf7;
  }

  /* Admin Tabs */
  .subtabs {
    display: flex;
    gap: 0.45rem;
    flex-wrap: wrap;
    margin-bottom: 1.2rem;
  }

  .subtab-btn {
    padding: 0.5rem 0.9rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-weight: 700;
    font-size: 0.84rem;
    cursor: pointer;
    font-family: inherit;
  }

  .subtab-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10, 18, 32, 0.62);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    z-index: 200;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal {
    background: var(--surface);
    border-radius: 16px;
    max-width: 480px;
    width: 100%;
    padding: 1.5rem;
    box-shadow: 0 24px 60px rgba(0,0,0,0.28);
    border-top: 4px solid var(--accent);
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }

  .close-x {
    background: none;
    border: none;
    font-size: 1.35rem;
    cursor: pointer;
    color: var(--muted);
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--primary-dark);
    color: #fff;
    padding: 0.75rem 1.1rem;
    border-radius: 10px;
    border-left: 4px solid var(--accent);
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    font-size: 0.86rem;
    font-weight: 600;
    z-index: 300;
    display: none;
  }

  .toast.show {
    display: block;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }

  th, td {
    padding: 0.6rem 0.65rem;
    border-bottom: 1px solid var(--border);
    text-align: left;
  }

  th {
    background: var(--surface-alt);
    color: var(--primary);
    font-weight: 800;
  }

  .muted { color: var(--muted); font-size: 0.84rem; }
  .hidden { display: none !important; }
  .mt-1 { margin-top: 0.5rem; }
  .mt-2 { margin-top: 1rem; }
  .flex-gap { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="logo-box" id="headerLogoBox">
        <!-- Default Dignified Emblem SVG -->
        <svg id="defaultLogoSvg" width="34" height="34" viewBox="0 0 36 36" fill="none">
          <circle cx="18" cy="18" r="15" stroke="#e7c675" stroke-width="2"/>
          <path d="M18 7V29M10 14H26" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
          <circle cx="18" cy="18" r="4" fill="#e7c675"/>
        </svg>
        <img id="customLogoImg" class="hidden" alt="Logo" />
      </div>
      <div class="brand-titles">
        <h1 id="siteNameDisplay">ተክለ ቴዎፍሎስ ሰ/ት/ቤት ትምህርት እና ሥልጠና ክፍል</h1>
        <p id="siteSubDisplay">Tekle Tewophilos Sunday School — Education & Training Department</p>
      </div>
    </div>

    <div class="header-controls">
      <button class="pill-btn" id="langToggleBtn" onclick="toggleLanguage()">🌐 English</button>
      <button class="pill-btn" id="syncBtn" onclick="syncFromCloud()" title="Sync Google Sheets">🔄 <span id="syncBtnText">Sync</span></button>
      <button class="pill-btn gold" id="loginOpenBtn" onclick="openLoginModal()">🔐 <span id="loginBtnText">ግባ / Login</span></button>
      <button class="pill-btn danger hidden" id="logoutBtn" onclick="logoutUser()">🚪 <span id="logoutBtnText">ውጣ / Logout</span></button>
    </div>
  </div>
</header>

<nav class="nav-bar">
  <div class="nav-tabs" id="navTabsContainer"></div>
</nav>

<main>
  <div class="session-strip" id="sessionStrip">
    <div id="sessionStatusText"></div>
    <div class="flex-gap" id="sessionQuickActions"></div>
  </div>

  <div id="pageContainer"></div>
</main>

<!-- Login Modal -->
<div class="modal-backdrop" id="loginModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="loginModalTitle">መግቢያ / Portal Login</h3>
      <button class="close-x" onclick="closeLoginModal()">&times;</button>
    </div>

    <div class="subtabs">
      <button class="subtab-btn active" id="roleTabStudent" onclick="switchLoginRole('student')">🎓 Student</button>
      <button class="subtab-btn" id="roleTabTeacher" onclick="switchLoginRole('teacher')">👨‍🏫 Teacher (7–12)</button>
      <button class="subtab-btn" id="roleTabAdmin" onclick="switchLoginRole('admin')">🛡️ Super Admin</button>
    </div>

    <!-- Student Login -->
    <form id="studentLoginForm" onsubmit="handleStudentLogin(event)">
      <div class="field">
        <label id="lblStudentGrade">ክፍል / Grade & Section</label>
        <select id="studentGradeSelect"></select>
      </div>
      <div class="field">
        <label id="lblStudentCode">የክፍል መግቢያ ኮድ / Section Passcode</label>
        <input type="password" id="studentPasscodeInput" required placeholder="e.g. 7A2026" />
      </div>
      <button type="submit" class="btn btn-gold" style="width:100%" id="btnStudentSubmit">ግባ / Enter Grade</button>
    </form>

    <!-- Teacher Login -->
    <form id="teacherLoginForm" class="hidden" onsubmit="handleTeacherLogin(event)">
      <div class="field">
        <label>Teacher ID / መምህር መታወቂያ</label>
        <input type="text" id="teacherIdInput" required placeholder="teacher" />
      </div>
      <div class="field">
        <label>PIN / የይለፍ ቃል</label>
        <input type="password" id="teacherPassInput" required placeholder="teach123" />
      </div>
      <button type="submit" class="btn" style="width:100%">Teacher Login / መምህር ይግቡ</button>
    </form>

    <!-- Super Admin Login -->
    <form id="adminLoginForm" class="hidden" onsubmit="handleAdminLogin(event)">
      <div class="field">
        <label>Super Admin Username</label>
        <input type="text" id="adminUserInput" required placeholder="admin" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="adminPassInput" required placeholder="admin123" />
      </div>
      <button type="submit" class="btn btn-gold" style="width:100%">Super Admin Login</button>
    </form>
  </div>
</div>

<div class="toast" id="toastBox"></div>

const STORAGE_KEY = 'tekle_tewophilos_portal_v1';
let state = loadState();
let currentUser = null; // { role: 'student'|'teacher'|'admin', grade?: string }
let activeTab = 'home';
let activeAdminSubtab = 'books';

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return structuredClone(DEFAULT_STATE);
    const parsed = JSON.parse(raw);
    return {
      ...structuredClone(DEFAULT_STATE),
      ...parsed,
      theme: { ...DEFAULT_STATE.theme, ...(parsed.theme || {}) },
      credentials: { ...DEFAULT_STATE.credentials, ...(parsed.credentials || {}) }
    };
  } catch (e) {
    return structuredClone(DEFAULT_STATE);
  }
}

function saveState(pushCloud = false) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  if (pushCloud && state.gasUrl) {
    pushToCloud();
  }
}

async function pushToCloud() {
  if (!state.gasUrl) return;
  try {
    await fetch(state.gasUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'syncAll',
        data: {
          Books: state.books,
          Announcements: state.announcements,
          Classrooms: state.classrooms,
          Sections: state.sections,
          Custom_Tabs: state.customTabs,
          Custom_Buttons: state.customButtons,
          UI_Theme: Object.entries(state.theme).map(([key, value]) => ({ key, value: String(value ?? '') }))
        }
      })
    });
    showToast(state.lang === 'am' ? 'ወደ Google Sheets ተልኳል' : 'Synced to Google Sheets');
  } catch (err) {
    console.warn(err);
  }
}

async function syncFromCloud() {
  if (!state.gasUrl) {
    showToast(state.lang === 'am' ? 'በመጀመሪያ የ Google Sheets Web App URL ያስገቡ' : 'Set Google Sheets Web App URL in Super Admin first');
    return;
  }
  try {
    const res = await fetch(state.gasUrl);
    const json = await res.json();
    if (json.status === 'ok' && json.data) {
      if (Array.isArray(json.data.Books) && json.data.Books.length) state.books = json.data.Books;
      if (Array.isArray(json.data.Announcements) && json.data.Announcements.length) state.announcements = json.data.Announcements;
      if (Array.isArray(json.data.Classrooms) && json.data.Classrooms.length) {
        state.classrooms = json.data.Classrooms.map(c => ({
          ...c,
          isLive: c.isLive === true || String(c.isLive).toLowerCase() === 'true'
        }));
      }
      if (Array.isArray(json.data.Sections) && json.data.Sections.length) {
        state.sections = json.data.Sections.map(s => ({
          ...s,
          onlineAllowed: s.onlineAllowed === true || String(s.onlineAllowed).toLowerCase() === 'true'
        }));
      }
      if (Array.isArray(json.data.Custom_Tabs)) {
        state.customTabs = json.data.Custom_Tabs.map(t => ({
          ...t,
          visible: t.visible === true || String(t.visible).toLowerCase() === 'true'
        }));
      }
      if (Array.isArray(json.data.Custom_Buttons)) {
        state.customButtons = json.data.Custom_Buttons.map(b => ({
          ...b,
          visible: b.visible === true || String(b.visible).toLowerCase() === 'true'
        }));
      }
      if (Array.isArray(json.data.UI_Theme)) {
        json.data.UI_Theme.forEach(row => {
          if (row.key) state.theme[row.key] = row.value;
        });
      }
      saveState(false);
      applyTheme();
      renderAll();
      showToast(state.lang === 'am' ? 'መረጃ ታድሷል' : 'Data synced from Google Sheets');
    }
  } catch (e) {
    showToast(state.lang === 'am' ? 'ማመሳሰል አልተሳካም' : 'Sync failed');
  }
}

function applyTheme() {
  const root = document.documentElement;
  root.style.setProperty('--primary', state.theme.primary || '#162a4a');
  root.style.setProperty('--primary-dark', state.theme.primaryDark || '#0e1c33');
  root.style.setProperty('--accent', state.theme.accent || '#b88a28');
  root.style.setProperty('--bg', state.theme.bg || '#f6f4ef');

  const img = document.getElementById('customLogoImg');
  const svg = document.getElementById('defaultLogoSvg');
  if (state.theme.logoUrl && state.theme.logoUrl.trim()) {
    img.src = state.theme.logoUrl.trim();
    img.classList.remove('hidden');
    svg.classList.add('hidden');
  } else {
    img.classList.add('hidden');
    svg.classList.remove('hidden');
  }
}

function toggleLanguage() {
  state.lang = state.lang === 'am' ? 'en' : 'am';
  saveState(false);
  renderAll();
}

function t(amText, enText) {
  return state.lang === 'am' ? amText : enText;
}

function showToast(msg) {
  const box = document.getElementById('toastBox');
  box.textContent = msg;
  box.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => box.classList.remove('show'), 3200);
}

/* Auth & Modals */
function openLoginModal(defaultRole = 'student') {
  populateStudentGradesSelect();
  switchLoginRole(defaultRole);

}

function closeLoginModal() {
  document.getElementById('loginModal').classList.remove('open');
}

function switchLoginRole(role) {
  ['student', 'teacher', 'admin'].forEach(r => {
    document.getElementById('roleTab' + r[0].toUpperCase() + r.slice(1)).classList.toggle('active', r === role);
    document.getElementById(r + 'LoginForm').classList.toggle('hidden', r !== role);
  });
}

function populateStudentGradesSelect() {
  const sel = document.getElementById('studentGradeSelect');
  sel.innerHTML = GRADES.map(g => `<option value="${g}">${t('ክፍል', 'Grade')} ${g}</option>`).join('');
}

function handleStudentLogin(e) {
  e.preventDefault();
  const grade = document.getElementById('studentGradeSelect').value;
  const code = document.getElementById('studentPasscodeInput').value.trim();
  const sec = state.sections.find(s => String(s.grade) === String(grade));
  if (!sec || sec.passcode !== code) {
    showToast(t('የክፍል መግቢያ ኮድ ትክክል አይደለም', 'Invalid section passcode'));
    return;
  }
  currentUser = { role: 'student', grade };
  document.getElementById('studentPasscodeInput').value = '';
  closeLoginModal();
  renderAll();
  showToast(t(`ወደ ክፍል ${grade} ገብተዋል`, `Logged in to Grade ${grade}`));
}

function handleTeacherLogin(e) {
  e.preventDefault();
  const id = document.getElementById('teacherIdInput').value.trim();
  const pass = document.getElementById('teacherPassInput').value.trim();
  if (id !== state.credentials.teacherId || pass !== state.credentials.teacherPass) {
    showToast(t('የመምህር መረጃ ትክክል አይደለም', 'Invalid teacher credentials'));
    return;
  }
  currentUser = { role: 'teacher' };
  document.getElementById('teacherPassInput').value = '';
  closeLoginModal();
  activeTab = 'classroom';
  renderAll();
  showToast(t('መምህር ገብተዋል', 'Teacher logged in'));
}

function handleAdminLogin(e) {
  e.preventDefault();
  const u = document.getElementById('adminUserInput').value.trim();
  const p = document.getElementById('adminPassInput').value.trim();
  if (u !== state.credentials.adminUser || p !== state.credentials.adminPass) {
    showToast(t('የሱፐር አድሚን መረጃ ትክክል አይደለም', 'Invalid Super Admin credentials'));
    return;
  }
  currentUser = { role: 'admin' };
  document.getElementById('adminPassInput').value = '';
  closeLoginModal();
  activeTab = 'admin';
  renderAll();
  showToast(t('እንኳን ወደ Super Admin Studio በደህና መጡ', 'Welcome to Super Admin Studio'));
}

function filterBooks() {
  const q = (document.getElementById('bookSearchInput')?.value || '').toLowerCase().trim();
  const gradeFilter = document.getElementById('bookGradeFilter')?.value || 'ALL';
  const isAdmin = currentUser?.role === 'admin';

  const matches = state.books.filter(b => {
    const titleMatch = (b.titleAm || '').toLowerCase().includes(q) ||
                       (b.titleEn || '').toLowerCase().includes(q) ||

function saveClassroomSession(e, grade) {
  e.preventDefault();
  const room = state.classrooms.find(c => String(c.grade) === String(grade));
  if (!room) return;
  room.isLive = true;
  room.teacherName = document.getElementById('tName_' + grade).value.trim();
  room.sessionPassword = document.getElementById('tPass_' + grade).value.trim();
  room.topicAm = document.getElementById('tTopicAm_' + grade).value.trim();
  room.topicEn = room.topicAm;
  room.meetingUrl = document.getElementById('tUrl_' + grade).value.trim();
  room.startedAt = new Date().toLocaleString();
  saveState(true);
  renderAll();
  showToast(t(`ለክፍል ${grade} የኦንላይን ክፍል ተከፍቷል`, `Live class started for Grade ${grade}`));
}

function stopClassroomSession(grade) {
  const room = state.classrooms.find(c => String(c.grade) === String(grade));
  if (!room) return;
  room.isLive = false;
  room.sessionPassword = '';
  saveState(true);
  renderAll();
  showToast(t(`የክፍል ${grade} ኦንላይን ክፍል ተዘግቷል`, `Live class ended for Grade ${grade}`));
}

function joinLiveSession(grade) {
  const room = state.classrooms.find(c => String(c.grade) === String(grade));
  const entered = (document.getElementById('joinPass_' + grade)?.value || '').trim();
  const out = document.getElementById('joinResult_' + grade);
  if (!room || !room.isLive) return;
  if (entered && entered === room.sessionPassword) {
    out.innerHTML = `<a class="btn btn-sm btn-gold" href="${room.meetingUrl}" target="_blank" rel="noopener">🚀 ${t('አሁን ወደ ክፍል ግባ', 'Launch Classroom Now')}</a>`;
  } else {
    out.innerHTML = `<span class="badge badge-red">${t('የክፍል የይለፍ ቃል ትክክል አይደለም', 'Incorrect session password')}</span>`;
  }
}

function copyInvite(grade) {
  const room = state.classrooms.find(c => String(c.grade) === String(grade));
  if (!room) return;
  const text = `ተክለ ቴዎፍሎስ ሰ/ት/ቤት — ክፍል ${grade} የኦንላይን ትምህርት
ርዕስ: ${room.topicAm || 'Live Class'}
የክፍል የይለፍ ቃል (Password): ${room.sessionPassword}
ሊንክ (Link): ${room.meetingUrl}`;
  navigator.clipboard?.writeText(text);
  showToast(t('መጋበዣው ኮፒ ተደርጓል', 'Invite copied to clipboard'));
}

  sec.passcode = document.getElementById('secCode_' + grade).value.trim();
  saveState(true);
  showToast(t(`የክፍል ${grade} ኮድ ተቀይሯል`, `Passcode updated for Grade ${grade}`));
}

function renderAdminUI(el) {
  el.innerHTML = `
    <div class="card">
      <h3 style="color:var(--primary);margin-bottom:0.75rem">${t('ሎጎ፣ ቀለም እና የዋና ገጽ ጽሑፍ', 'Logo, Colors & Hero Text')}</h3>
      <form onsubmit="handleSaveUI(event)">
        <div class="grid-2">
          <div class="field"><label>Primary Color</label><input type="color" id="uiPrimary" value="${state.theme.primary}" /></div>
          <div class="field"><label>Accent Color (Gold)</label><input type="color" id="uiAccent" value="${state.theme.accent}" /></div>
        </div>
        <div class="field">
          <label>Logo Image URL or Upload File</label>
          <input type="text" id="uiLogoUrl" value="${state.theme.logoUrl || ''}" placeholder="https://... or upload below" />
          <input type="file" accept="image/*" class="mt-1" onchange="handleLogoUpload(event)" />
        </div>
        <div class="grid-2">
          <div class="field"><label>Hero Title (Amharic)</label><input type="text" id="uiHeroAm" value="${state.theme.heroTitleAm}" /></div>
          <div class="field"><label>Hero Title (English)</label><input type="text" id="uiHeroEn" value="${state.theme.heroTitleEn}" /></div>
        </div>
        <button type="submit" class="btn btn-gold">${t('ለውጦችን አስቀምጥ', 'Save UI Changes')}</button>
      </form>
    </div>
  `;
}

function handleLogoUpload(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    document.getElementById('uiLogoUrl').value = reader.result;
  };
  reader.readAsDataURL(file);
}

function handleSaveUI(e) {
  e.preventDefault();
  state.theme.primary = document.getElementById('uiPrimary').value;
  state.theme.accent = document.getElementById('uiAccent').value;
  state.theme.logoUrl = document.getElementById('uiLogoUrl').value.trim();
  state.theme.heroTitleAm = document.getElementById('uiHeroAm').value.trim();
  state.theme.heroTitleEn = document.getElementById('uiHeroEn').value.trim();
  saveState(true);
  applyTheme();
  renderAll();
  showToast(t('የገጽ ገጽታ ተቀይሯል', 'UI theme updated'));
}

function renderAdminBuilder(el) {
  el.innerHTML = `
    <div class="grid-2">
      <div class="card">
        <h3 style="color:var(--primary);margin-bottom:0.75rem">${t('አዲስ ታብ ጨምር / ሰርዝ', 'Add / Delete Custom Tabs')}</h3>
        <form onsubmit="handleAddCustomTab(event)">
          <div class="grid-2">
            <div class="field"><label>Tab Name (Amharic)</label><input type="text" id="ctAm" required /></div>
            <div class="field"><label>Tab Name (English)</label><input type="text" id="ctEn" required /></div>
          </div>
          <div class="field"><label>Content (Amharic)</label><textarea id="ctBodyAm" rows="2"></textarea></div>
          <div class="field"><label>Content (English)</label><textarea id="ctBodyEn" rows="2"></textarea></div>
          <button type="submit" class="btn btn-sm btn-gold">+ ${t('ታብ ጨምር', 'Add Tab')}</button>
        </form>
        <div class="mt-2">
          ${state.customTabs.map(ct => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:0.45rem 0;border-bottom:1px solid var(--border)">
              <span>${t(ct.labelAm, ct.labelEn)}</span>
              <button class="btn btn-sm btn-danger" onclick="deleteCustomTab('${ct.id}')">${t('ሰርዝ', 'Delete')}</button>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="card">
        <h3 style="color:var(--primary);margin-bottom:0.75rem">${t('አዲስ አዝራር ጨምር / ሰርዝ', 'Add / Delete Custom Buttons')}</h3>
        <form onsubmit="handleAddCustomBtn(event)">
          <div class="grid-2">
            <div class="field"><label>Button Text (Amharic)</label><input type="text" id="cbAm" required /></div>
            <div class="field"><label>Button Text (English)</label><input type="text" id="cbEn" required /></div>
          </div>
          <div class="field"><label>Link URL (or #library, #notices, #classroom)</label><input type="text" id="cbUrl" required value="#library" /></div>
          <button type="submit" class="btn btn-sm btn-gold">+ ${t('አዝራር ጨምር', 'Add Button')}</button>
        </form>
        <div class="mt-2">
          ${state.customButtons.map(cb => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:0.45rem 0;border-bottom:1px solid var(--border)">
              <span>${t(cb.labelAm, cb.labelEn)}</span>
              <button class="btn btn-sm btn-danger" onclick="deleteCustomBtn('${cb.id}')">${t('ሰርዝ', 'Delete')}</button>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function handleAddCustomTab(e) {
  e.preventDefault();
  state.customTabs.push({
    id: 'tab-' + Date.now(),
    labelAm: document.getElementById('ctAm').value.trim(),
    labelEn: document.getElementById('ctEn').value.trim(),
    icon: '📌',
    contentAm: document.getElementById('ctBodyAm').value.trim(),
    contentEn: document.getElementById('ctBodyEn').value.trim(),
    visible: true
  });
  saveState(true);
  renderAll();
}

function deleteCustomTab(id) {
  state.customTabs = state.customTabs.filter(t => t.id !== id);
  if (activeTab === id) activeTab = 'home';
  saveState(true);
  renderAll();
}

function handleAddCustomBtn(e) {
  e.preventDefault();
  state.customButtons.push({
    id: 'btn-' + Date.now(),
    labelAm: document.getElementById('cbAm').value.trim(),
    labelEn: document.getElementById('cbEn').value.trim(),
    url: document.getElementById('cbUrl').value.trim(),
    color: state.theme.accent,
    location: 'hero',
    visible: true
  });
  saveState(true);
  renderAll();
}

function deleteCustomBtn(id) {
  state.customButtons = state.customButtons.filter(b => b.id !== id);
  saveState(true);
  renderAll();
}

function renderAdminSync(el) {
  el.innerHTML = `
    <div class="card">
      <h3 style="color:var(--primary);margin-bottom:0.5rem">Google Apps Script Web App URL</h3>
      <p class="muted mb-1" style="margin-bottom:0.85rem">${t('የ Apps Script /exec ሊንክ እዚህ ያስገቡ።', 'Paste your deployed Google Apps Script Web App (/exec) URL below.')}</p>
      <div class="field">
        <input type="url" id="gasUrlInput" value="${state.gasUrl || ''}" placeholder="https://script.google.com/macros/s/.../exec" />
      </div>
      <div class="flex-gap">
        <button class="btn btn-gold" onclick="saveGasUrl()">${t('አስቀምጥ እና አመሳስል', 'Save & Push to Sheet')}</button>
        <button class="btn btn-outline" onclick="syncFromCloud()">${t('ከ Sheet አምጣ', 'Pull from Sheet')}</button>
      </div>
    </div>
  `;
}

function saveGasUrl() {
  state.gasUrl = document.getElementById('gasUrlInput').value.trim();
  saveState(true);
  showToast(t('URL ተቀምጧል', 'Web App URL saved'));
}

function renderAll() {
  applyTheme();
  renderHeaderAndNav();
  renderPage();
}

renderAll();
</script>
</body>
</html>
